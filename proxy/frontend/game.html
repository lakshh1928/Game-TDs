<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDS | Setup Players</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="bg"></div>

    <header id="header">
        <img src="logo.png" alt="Logo" id="logo">
        <div id="social-icons">
            <a href="https://discord.gg/YF22Vbcy9G"><div id="dc" class="social-icon"></div></a>
            <a href="https://www.instagram.com/lucifer.cpm/"><div id="ig" class="social-icon"></div></a>
            <button id="htp">How to Play</button>
        </div>
    </header>

    <main>
        <div id="welcome">
            <h2>WHO'S PLAYING?</h2>
            <p>Enter the names of the brave souls.</p>
            
            <div id="input-area" style="margin-bottom: 20px;">
                <input type="text" id="player-input" class="player-input" placeholder="Enter Player Name...">
            </div>

            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;">
                <button id="add-player" class="secondary-btn">+ Add Player</button>
                <button id="start-game" class="primary-btn">Start Game</button>
            </div>

            <div id="players-list" style="width: 100%; max-width: 400px; max-height: 300px; overflow-y: auto;">
                </div>
        </div>
    </main>

    <footer id="footer">
        © 2025 TDS Game | All Rights Reserved
    </footer>

    <div id="htp-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>How to Play</h2>
            <br>
            <p style="text-align: left; line-height: 2;">
                1️⃣ Add Player Names.<br>
                2️⃣ Spin the Wheel.<br>
                3️⃣ Choose Truth or Dare.
            </p>
        </div>
    </div>

    <script src="script.js"></script>
    
    <script>
        const modal = document.getElementById("htp-modal");
        const btn = document.getElementById("htp");
        const span = document.getElementsByClassName("close")[0];

        btn.onclick = function() { modal.style.display = "flex"; }
        span.onclick = function() { modal.style.display = "none"; }
        window.onclick = function(event) {
             if (event.target == modal) { modal.style.display = "none"; }
        }
    </script>
</body>
</html>
