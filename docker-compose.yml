services:
  nginx:
    image: l4ksh1928/tdsnginx:latest
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - app1
      - app2
    networks:
      - tds
    deploy:
      resources:
        limits:
          memory: 128M

  db:
    image: l4ksh1928/tdsmysql:latest
    container_name: db
    volumes:
      - tds_db:/var/lib/mysql
    env_file:
      - .env
    networks:
      - tds
    deploy:
      resources:
        limits:
          memory: 512M

  app1:
    image: l4ksh1928/tds:latest
    container_name: app1
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - tds
    deploy:
      resources:
        limits:
          memory: 128M

  app2:
    image: l4ksh1928/tds:latest
    container_name: app2
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - tds
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  tds:
    driver: bridge

volumes:
  tds_db:                 
